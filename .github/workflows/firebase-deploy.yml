name: Deploy to Firebase

# main branch वर प्रत्येक push नंतर आपोआप Hosting + Firestore rules + Storage rules deploy होतात.
# GitHub → Settings → Secrets and variables → Actions मध्ये FIREBASE_SERVICE_ACCOUNT नावाचा secret आवश्यक.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secret
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret सेट केलेला नाही (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Write service account key
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Deploy
        run: npx --yes firebase-tools@13.35.1 deploy --project sk-computer-53668 --only hosting,firestore:rules,storage --non-interactive

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
