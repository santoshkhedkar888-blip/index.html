<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SK Computer - Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  #print{display:none}
  @media print{
    body *{visibility:hidden}
    #print,#print *{visibility:visible}
    #print{display:block;position:absolute;left:0;top:0;width:100%;padding:24px}
  }
</style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

<!-- LOGIN -->
<div id="loginBox" class="min-h-screen flex items-center justify-center p-4">
  <form id="loginForm" class="bg-white p-6 rounded-xl shadow w-full max-w-sm space-y-3">
    <h1 class="text-xl font-bold text-center">SK Computer – ॲडमिन लॉगिन</h1>
    <input id="email" type="email" required placeholder="ईमेल" class="w-full border rounded p-2">
    <input id="password" type="password" required placeholder="पासवर्ड" class="w-full border rounded p-2">
    <button class="w-full bg-blue-600 text-white rounded p-2 font-semibold">लॉगिन</button>
    <p id="loginErr" class="text-red-600 text-sm text-center"></p>
  </form>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header class="bg-blue-700 text-white p-3 flex items-center justify-between">
    <div class="font-bold">SK Computer – ॲडमिन पॅनल</div>
    <button id="logoutBtn" class="bg-white/20 px-3 py-1 rounded text-sm">लॉगआउट</button>
  </header>

  <nav class="bg-white shadow flex text-sm">
    <button data-tab="dash" class="tab flex-1 p-3 font-semibold">डॅशबोर्ड</button>
    <button data-tab="jobs" class="tab flex-1 p-3 font-semibold">जॉब कार्ड</button>
    <button data-tab="cust" class="tab flex-1 p-3 font-semibold">ग्राहक</button>
  </nav>

  <main class="p-3 max-w-5xl mx-auto">

    <!-- Dashboard -->
    <section id="tab-dash" class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <div class="bg-white rounded-xl p-4 shadow"><div class="text-xs text-slate-500">एकूण जॉब</div><div id="sTotal" class="text-2xl font-bold">0</div></div>
      <div class="bg-yellow-50 rounded-xl p-4 shadow"><div class="text-xs text-slate-500">प्रलंबित</div><div id="sPending" class="text-2xl font-bold">0</div></div>
      <div class="bg-blue-50 rounded-xl p-4 shadow"><div class="text-xs text-slate-500">प्रक्रियेत</div><div id="sProc" class="text-2xl font-bold">0</div></div>
      <div class="bg-green-50 rounded-xl p-4 shadow"><div class="text-xs text-slate-500">पूर्ण</div><div id="sDone" class="text-2xl font-bold">0</div></div>
      <div class="bg-white rounded-xl p-4 shadow col-span-2"><div class="text-xs text-slate-500">एकूण रक्कम</div><div id="sAmt" class="text-2xl font-bold">₹0</div></div>
      <div class="bg-white rounded-xl p-4 shadow col-span-2"><div class="text-xs text-slate-500">बाकी रक्कम</div><div id="sDue" class="text-2xl font-bold text-red-600">₹0</div></div>
    </section>

    <!-- Jobs -->
    <section id="tab-jobs" class="hidden space-y-3">
      <div class="flex gap-2">
        <input id="jobSearch" placeholder="नाव / मोबाईल शोधा" class="flex-1 border rounded p-2 bg-white">
        <select id="jobFilter" class="border rounded p-2 bg-white">
          <option value="">सर्व</option><option>Pending</option><option>Processing</option><option>Completed</option>
        </select>
        <button id="newJobBtn" class="bg-blue-600 text-white rounded px-3 font-semibold">+ नवीन</button>
      </div>
      <div id="jobList" class="space-y-2"></div>
    </section>

    <!-- Customers -->
    <section id="tab-cust" class="hidden space-y-3">
      <input id="custSearch" placeholder="नाव / मोबाईल शोधा" class="w-full border rounded p-2 bg-white">
      <div id="custList" class="space-y-2"></div>
    </section>
  </main>
</div>

<!-- Job modal -->
<div id="jobModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-3 z-10">
  <form id="jobForm" class="bg-white rounded-xl p-4 w-full max-w-md space-y-2 max-h-[90vh] overflow-auto">
    <h2 class="font-bold text-lg">नवीन जॉब कार्ड</h2>
    <input id="jName" required placeholder="ग्राहकाचे नाव" class="w-full border rounded p-2">
    <input id="jMobile" required pattern="[0-9]{10}" placeholder="मोबाईल (10 अंक)" class="w-full border rounded p-2">
    <input id="jService" required placeholder="सेवा (उदा. आधार, पॅन, उत्पन्न दाखला)" class="w-full border rounded p-2">
    <div class="flex gap-2">
      <input id="jAmount" type="number" min="0" required placeholder="एकूण रक्कम ₹" class="w-1/2 border rounded p-2">
      <input id="jPaid" type="number" min="0" value="0" placeholder="मिळालेली ₹" class="w-1/2 border rounded p-2">
    </div>
    <textarea id="jNotes" placeholder="टीप" class="w-full border rounded p-2"></textarea>
    <input id="jFiles" type="file" multiple class="w-full text-sm">
    <div class="flex gap-2 pt-2">
      <button type="button" id="jCancel" class="flex-1 border rounded p-2">रद्द</button>
      <button id="jSave" class="flex-1 bg-blue-600 text-white rounded p-2 font-semibold">सेव्ह</button>
    </div>
  </form>
</div>

<!-- Print area -->
<div id="print"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, setDoc, updateDoc, getDoc, onSnapshot, query, orderBy, serverTimestamp, arrayUnion, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

// ====== इथे तुमचा Firebase config टाका (Project settings > Your apps) ======
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "sk-computer-53668.firebaseapp.com",
  projectId: "sk-computer-53668",
  storageBucket: "sk-computer-53668.firebasestorage.app",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
// ===========================================================================

const app = initializeApp(firebaseConfig);
const auth = getAuth(app), db = getFirestore(app), storage = getStorage(app);
const $ = id => document.getElementById(id);
let jobs = [], customers = [], unsubs = [];

// ---------- Auth ----------
$("loginForm").onsubmit = async e => {
  e.preventDefault(); $("loginErr").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("email").value, $("password").value); }
  catch { $("loginErr").textContent = "ईमेल किंवा पासवर्ड चुकीचा आहे"; }
};
$("logoutBtn").onclick = () => signOut(auth);

onAuthStateChanged(auth, async user => {
  unsubs.forEach(u => u()); unsubs = [];
  if (!user) { $("app").classList.add("hidden"); $("loginBox").classList.remove("hidden"); return; }
  const adm = await getDoc(doc(db, "admins", user.uid)).catch(() => null);
  if (!adm || !adm.exists()) {
    $("loginErr").textContent = "हा युझर ॲडमिन नाही. admins collection मध्ये UID जोडा: " + user.uid;
    await signOut(auth); return;
  }
  $("loginBox").classList.add("hidden"); $("app").classList.remove("hidden");
  unsubs.push(onSnapshot(query(collection(db, "jobs"), orderBy("createdAt", "desc")), s => {
    jobs = s.docs.map(d => ({ id: d.id, ...d.data() })); renderAll();
  }));
  unsubs.push(onSnapshot(collection(db, "customers"), s => {
    customers = s.docs.map(d => ({ id: d.id, ...d.data() })); renderCust();
  }));
  showTab("dash");
});

// ---------- Tabs ----------
function showTab(t) {
  ["dash", "jobs", "cust"].forEach(x => $("tab-" + x).classList.toggle("hidden", x !== t));
  document.querySelectorAll(".tab").forEach(b => {
    const on = b.dataset.tab === t;
    b.classList.toggle("border-b-4", on); b.classList.toggle("border-blue-600", on); b.classList.toggle("text-blue-700", on);
  });
}
document.querySelectorAll(".tab").forEach(b => b.onclick = () => showTab(b.dataset.tab));

// ---------- Render ----------
const stColor = { Pending: "bg-yellow-100 text-yellow-800", Processing: "bg-blue-100 text-blue-800", Completed: "bg-green-100 text-green-800" };
const stMr = { Pending: "प्रलंबित", Processing: "प्रक्रियेत", Completed: "पूर्ण" };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function renderAll() { renderStats(); renderJobs(); renderCust(); }

function renderStats() {
  $("sTotal").textContent = jobs.length;
  $("sPending").textContent = jobs.filter(j => j.status === "Pending").length;
  $("sProc").textContent = jobs.filter(j => j.status === "Processing").length;
  $("sDone").textContent = jobs.filter(j => j.status === "Completed").length;
  const amt = jobs.reduce((a, j) => a + (+j.amount || 0), 0), paid = jobs.reduce((a, j) => a + (+j.paid || 0), 0);
  $("sAmt").textContent = "₹" + amt; $("sDue").textContent = "₹" + (amt - paid);
}

function renderJobs() {
  const q = $("jobSearch").value.trim().toLowerCase(), f = $("jobFilter").value;
  const list = jobs.filter(j => (!f || j.status === f) && (!q || (j.name + j.mobile).toLowerCase().includes(q)));
  $("jobList").innerHTML = list.map(j => {
    const due = (+j.amount || 0) - (+j.paid || 0);
    return `<div class="bg-white rounded-xl p-3 shadow space-y-2">
      <div class="flex justify-between items-start">
        <div><div class="font-bold">${esc(j.name)} <span class="text-slate-500 font-normal text-sm">${esc(j.mobile)}</span></div>
        <div class="text-sm">${esc(j.service)}</div></div>
        <span class="text-xs px-2 py-1 rounded ${stColor[j.status] || ""}">${stMr[j.status] || ""}</span>
      </div>
      <div class="text-sm">एकूण ₹${j.amount || 0} · मिळाले ₹${j.paid || 0} · <b class="${due > 0 ? "text-red-600" : "text-green-600"}">बाकी ₹${due}</b></div>
      ${j.notes ? `<div class="text-xs text-slate-500">${esc(j.notes)}</div>` : ""}
      <div class="flex flex-wrap gap-1 text-xs">${(j.files || []).map(f => `<a target="_blank" rel="noopener" href="${esc(f.url)}" class="underline text-blue-600">📎 ${esc(f.name)}</a>`).join("")}</div>
      <div class="flex flex-wrap gap-2 text-sm">
        <select data-status="${j.id}" class="border rounded p-1">
          ${["Pending", "Processing", "Completed"].map(s => `<option value="${s}" ${s === j.status ? "selected" : ""}>${stMr[s]}</option>`).join("")}
        </select>
        <button data-pay="${j.id}" class="border rounded px-2 py-1">+ पेमेंट</button>
        <button data-print="${j.id}" class="border rounded px-2 py-1">🖨 बिल</button>
        <a target="_blank" rel="noopener" href="https://wa.me/91${esc(j.mobile)}?text=${encodeURIComponent("नमस्कार " + j.name + ", तुमचे '" + j.service + "' काम: " + stMr[j.status] + ". - SK Computer")}" class="border rounded px-2 py-1">WhatsApp</a>
      </div>
    </div>`;
  }).join("") || '<div class="text-center text-slate-500 p-6">काहीही सापडले नाही</div>';

  document.querySelectorAll("[data-status]").forEach(s => s.onchange = () => updateDoc(doc(db, "jobs", s.dataset.status), { status: s.value }));
  document.querySelectorAll("[data-pay]").forEach(b => b.onclick = () => addPayment(b.dataset.pay));
  document.querySelectorAll("[data-print]").forEach(b => b.onclick = () => printInvoice(b.dataset.print));
}
$("jobSearch").oninput = renderJobs; $("jobFilter").onchange = renderJobs;

function renderCust() {
  const q = $("custSearch").value.trim().toLowerCase();
  $("custList").innerHTML = customers.filter(c => !q || (c.name + c.id).toLowerCase().includes(q)).map(c => {
    const cj = jobs.filter(j => j.mobile === c.id);
    const due = cj.reduce((a, j) => a + (+j.amount || 0) - (+j.paid || 0), 0);
    return `<div class="bg-white rounded-xl p-3 shadow flex justify-between">
      <div><div class="font-bold">${esc(c.name)}</div><div class="text-sm text-slate-500">${esc(c.id)}</div></div>
      <div class="text-right text-sm">जॉब: ${cj.length}<br><span class="${due > 0 ? "text-red-600" : "text-green-600"}">बाकी ₹${due}</span></div>
    </div>`;
  }).join("") || '<div class="text-center text-slate-500 p-6">ग्राहक नाहीत</div>';
}
$("custSearch").oninput = renderCust;

// ---------- New job ----------
$("newJobBtn").onclick = () => $("jobModal").classList.remove("hidden");
$("jCancel").onclick = () => $("jobModal").classList.add("hidden");
$("jobForm").onsubmit = async e => {
  e.preventDefault(); $("jSave").disabled = true; $("jSave").textContent = "सेव्ह होत आहे...";
  try {
    const mobile = $("jMobile").value.trim(), name = $("jName").value.trim();
    const files = [];
    for (const f of $("jFiles").files) {
      const r = ref(storage, `jobs/${mobile}/${Date.now()}_${f.name}`);
      await uploadBytes(r, f); files.push({ name: f.name, url: await getDownloadURL(r) });
    }
    const paid = +$("jPaid").value || 0;
    await addDoc(collection(db, "jobs"), {
      name, mobile, service: $("jService").value.trim(), amount: +$("jAmount").value, paid,
      notes: $("jNotes").value.trim(), status: "Pending", files,
      payments: paid ? [{ amount: paid, date: new Date().toISOString(), mode: "Cash" }] : [],
      createdAt: serverTimestamp()
    });
    await setDoc(doc(db, "customers", mobile), { name, updatedAt: serverTimestamp() }, { merge: true });
    $("jobForm").reset(); $("jobModal").classList.add("hidden");
  } catch (err) { alert("त्रुटी: " + err.message); }
  $("jSave").disabled = false; $("jSave").textContent = "सेव्ह";
};

// ---------- Payment ----------
async function addPayment(id) {
  const v = prompt("मिळालेली रक्कम (₹):"); const amt = +v;
  if (!v || !(amt > 0)) return;
  const mode = prompt("पद्धत (Cash / UPI):", "Cash") || "Cash";
  await updateDoc(doc(db, "jobs", id), { paid: increment(amt), payments: arrayUnion({ amount: amt, date: new Date().toISOString(), mode }) });
}

// ---------- Invoice ----------
function printInvoice(id) {
  const j = jobs.find(x => x.id === id); if (!j) return;
  const due = (+j.amount || 0) - (+j.paid || 0);
  const d = j.createdAt?.toDate ? j.createdAt.toDate() : new Date();
  $("print").innerHTML = `
    <div style="font-family:sans-serif;max-width:600px;margin:auto">
      <h1 style="text-align:center;margin:0">SK Computer</h1>
      <p style="text-align:center;margin:2px 0">आपले सरकार व डिजिटल सेवा केंद्र, एकनाथवाडी (पाथर्डी)</p>
      <p style="text-align:center;margin:2px 0">मोबाईल: 8888146077</p>
      <hr style="margin:12px 0">
      <h2 style="text-align:center">जॉब कार्ड / पावती</h2>
      <p>दिनांक: ${d.toLocaleDateString("mr-IN")}</p>
      <p>ग्राहक: <b>${esc(j.name)}</b> (${esc(j.mobile)})</p>
      <p>सेवा: ${esc(j.service)}</p>
      <p>स्थिती: ${stMr[j.status]}</p>
      <table style="width:100%;border-collapse:collapse;margin-top:10px" border="1" cellpadding="6">
        <tr><td>एकूण रक्कम</td><td align="right">₹${j.amount}</td></tr>
        <tr><td>मिळालेली रक्कम</td><td align="right">₹${j.paid || 0}</td></tr>
        <tr><td><b>बाकी रक्कम</b></td><td align="right"><b>₹${due}</b></td></tr>
      </table>
      <p style="margin-top:30px;text-align:right">सही / शिक्का</p>
      <p style="text-align:center;font-size:12px">UPI: santoshkhedkar@ybl · धन्यवाद!</p>
    </div>`;
  window.print();
}
</script>
</body>
</html>
